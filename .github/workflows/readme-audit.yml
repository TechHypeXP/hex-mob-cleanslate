name: README Audit

on:
  pull_request:
    branches: [ "main" ]

jobs:
  validate-readmes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Validate 10x READMEs
        run: |
          node tools/scripts/validate-readmes.mjs